<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PowerPilot agent architecture</title>
  <desc id="desc">High level diagram showing smart meter ingestion, shared energy and weather tools, interactive chat, background monitoring agents, Copilot orchestration, dashboard and notifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#edf4f2"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123c45"/>
      <stop offset="1" stop-color="#1e6470"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173c43" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3d6f73"/>
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8ebdb9"/>
    </marker>
    <style>
      .title { font: 700 33px 'Segoe UI', sans-serif; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #cce3df; letter-spacing: 0; }
      .section { font: 700 18px 'Segoe UI', sans-serif; fill: #16454c; letter-spacing: 0; }
      .label { font: 700 16px 'Segoe UI', sans-serif; fill: #173c43; letter-spacing: 0; }
      .body { font: 400 14px 'Segoe UI', sans-serif; fill: #3d5558; letter-spacing: 0; }
      .small { font: 400 12px 'Segoe UI', sans-serif; fill: #557174; letter-spacing: 0; }
      .whiteLabel { font: 700 16px 'Segoe UI', sans-serif; fill: #ffffff; letter-spacing: 0; }
      .whiteBody { font: 400 13px 'Segoe UI', sans-serif; fill: #e6f3f0; letter-spacing: 0; }
      .pill { font: 700 12px 'Segoe UI', sans-serif; fill: #276267; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #c9dcda; stroke-width: 1.5; rx: 12; }
      .tealBox { fill: #e5f2ef; stroke: #83b9b2; stroke-width: 1.5; rx: 12; }
      .blueBox { fill: #e8f0f7; stroke: #9bb7cd; stroke-width: 1.5; rx: 12; }
      .amberBox { fill: #fff4db; stroke: #e1b968; stroke-width: 1.5; rx: 12; }
      .line { stroke: #3d6f73; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lineDashed { stroke: #79aaa7; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrowLight); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="36" y="30" width="1528" height="128" rx="22" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="76" y="82" class="title">PowerPilot agent architecture</text>
  <text x="76" y="114" class="subtitle">Live meter data becomes timely, explainable energy guidance through shared tools and specialized agents.</text>
  <rect x="1240" y="72" width="278" height="45" rx="22" fill="#2d7d82"/>
  <text x="1379" y="100" text-anchor="middle" class="whiteLabel">GitHub Copilot SDK</text>

  <text x="70" y="206" class="section">1. Observe</text>
  <text x="500" y="206" class="section">2. Equip</text>
  <text x="940" y="206" class="section">3. Reason</text>
  <text x="1330" y="206" class="section">4. Act</text>

  <rect x="62" y="230" width="320" height="230" class="box" filter="url(#shadow)"/>
  <circle cx="104" cy="274" r="25" fill="#d8eee9"/>
  <path d="M91 275 h26 M96 267 v16 M103 262 v26 M110 267 v16" stroke="#2d7777" stroke-width="3" fill="none"/>
  <text x="144" y="270" class="label">Smart meter input</text>
  <text x="144" y="294" class="small">IP1 reader</text>
  <text x="86" y="338" class="body">Simulated, HomeWizard, or serial</text>
  <text x="86" y="363" class="body">reader emits P1 telegrams.</text>
  <rect x="86" y="392" width="272" height="45" rx="9" fill="#f1f7f6"/>
  <text x="102" y="411" class="pill">CURRENT SIGNALS</text>
  <text x="102" y="429" class="small">usage, delivery, tariff, gas, timestamp</text>

  <rect x="62" y="505" width="320" height="230" class="box" filter="url(#shadow)"/>
  <text x="86" y="547" class="label">P1BackgroundService</text>
  <text x="86" y="577" class="body">Updates shared live state on every</text>
  <text x="86" y="599" class="body">telegram and persists every sixth</text>
  <text x="86" y="621" class="body">reading through the repository.</text>
  <rect x="86" y="653" width="272" height="55" rx="9" fill="#eef5f6"/>
  <text x="102" y="676" class="pill">STORAGE + REAL TIME</text>
  <text x="102" y="696" class="small">EnergyStateService + SQLite history</text>

  <path d="M222 460 L222 500" class="line"/>
  <path d="M382 350 C430 350 435 590 475 590" class="line"/>
  <path d="M382 620 C430 620 435 650 475 650" class="line"/>

  <rect x="475" y="230" width="355" height="505" class="tealBox" filter="url(#shadow)"/>
  <text x="505" y="272" class="label">Shared skill and tool layer</text>
  <text x="505" y="298" class="body">Agents do not reach into the database directly.</text>
  <text x="505" y="319" class="body">They call safe, read-only plugin tools.</text>
  <rect x="505" y="347" width="295" height="135" class="box"/>
  <text x="529" y="378" class="label">EnergyPlugin</text>
  <text x="529" y="406" class="small">get_current_power</text>
  <text x="529" y="428" class="small">get_today_stats / get_energy_stats</text>
  <text x="529" y="450" class="small">get_hourly_profile</text>
  <text x="529" y="472" class="small">get_appliance_advice</text>
  <rect x="505" y="505" width="295" height="105" class="box"/>
  <text x="529" y="536" class="label">WeatherPlugin</text>
  <text x="529" y="564" class="small">get_current_weather</text>
  <text x="529" y="586" class="small">get_solar_forecast</text>
  <rect x="505" y="633" width="295" height="67" rx="10" fill="#d5ebe6"/>
  <text x="529" y="661" class="pill">CAPABILITIES / SKILLS</text>
  <text x="529" y="683" class="small">live energy, history, appliance timing, weather</text>

  <path d="M830 370 C875 370 875 315 915 315" class="line"/>
  <path d="M830 570 C875 570 875 600 915 600" class="line"/>

  <rect x="915" y="230" width="355" height="200" class="blueBox" filter="url(#shadow)"/>
  <text x="945" y="271" class="label">Interactive chat agent</text>
  <text x="945" y="298" class="body">ChatAgentService owns one streaming</text>
  <text x="945" y="320" class="body">session per Blazor circuit.</text>
  <rect x="945" y="350" width="295" height="52" rx="9" fill="#f5f8fb"/>
  <text x="962" y="372" class="pill">USER QUESTION</text>
  <text x="962" y="390" class="small">fetch current facts, then answer clearly</text>

  <rect x="915" y="470" width="355" height="265" class="amberBox" filter="url(#shadow)"/>
  <text x="945" y="511" class="label">Background monitoring flow</text>
  <text x="945" y="538" class="body">EnergyMonitoringAgentService watches</text>
  <text x="945" y="560" class="body">for sustained surplus and starts a session.</text>
  <rect x="945" y="586" width="135" height="112" class="box"/>
  <text x="1012" y="615" text-anchor="middle" class="label">Energy</text>
  <text x="1012" y="635" text-anchor="middle" class="label">Analyzer</text>
  <text x="1012" y="662" text-anchor="middle" class="small">patterns, size,</text>
  <text x="1012" y="680" text-anchor="middle" class="small">tariffs</text>
  <rect x="1095" y="586" width="135" height="112" class="box"/>
  <text x="1162" y="615" text-anchor="middle" class="label">Appliance</text>
  <text x="1162" y="635" text-anchor="middle" class="label">Advisor</text>
  <text x="1162" y="662" text-anchor="middle" class="small">what to run</text>
  <text x="1162" y="680" text-anchor="middle" class="small">now</text>
  <rect x="945" y="710" width="285" height="0" fill="none"/>
  <text x="945" y="720" class="small">Timing Optimizer adds weather and forecast context.</text>

  <path d="M1270 330 C1300 330 1300 330 1328 330" class="line"/>
  <path d="M1270 600 C1300 600 1300 600 1328 600" class="line"/>
  <rect x="1328" y="230" width="210" height="200" class="box" filter="url(#shadow)"/>
  <circle cx="1380" cy="275" r="24" fill="#e3eef8"/>
  <path d="M1368 275 h24 M1380 263 v24" stroke="#47718c" stroke-width="3"/>
  <text x="1417" y="271" class="label">Dashboard</text>
  <text x="1355" y="321" class="body">Blazor UI</text>
  <text x="1355" y="347" class="body">SignalR live updates</text>
  <text x="1355" y="373" class="body">charts and summaries</text>
  <text x="1355" y="399" class="small">Chat response streams back</text>

  <rect x="1328" y="470" width="210" height="265" class="box" filter="url(#shadow)"/>
  <circle cx="1380" cy="516" r="24" fill="#fff0cc"/>
  <path d="M1370 516 h20 M1374 509 v14 M1386 509 v14" stroke="#ad7b1c" stroke-width="3" fill="none"/>
  <text x="1417" y="512" class="label">Notification</text>
  <text x="1355" y="558" class="body">Monitor synthesizes</text>
  <text x="1355" y="582" class="body">specialist insights into</text>
  <text x="1355" y="606" class="body">a concise JSON result.</text>
  <rect x="1355" y="638" width="156" height="67" rx="9" fill="#fff8e9"/>
  <text x="1370" y="660" class="pill">OUTCOME</text>
  <text x="1370" y="680" class="small">actionable message</text>
  <text x="1370" y="697" class="small">+ severity</text>

  <path d="M1095 730 C1095 790 1095 815 1200 815 L1430 815 L1430 748" class="lineDashed"/>
  <rect x="415" y="815" width="1120" height="112" rx="15" fill="#173f47" filter="url(#shadow)"/>
  <text x="450" y="855" class="whiteLabel">One shared loop</text>
  <text x="450" y="882" class="whiteBody">Observe live state and history  ->  call the smallest useful tool  ->  reason with a focused agent  ->  return an answer or notification.</text>
  <text x="450" y="907" class="whiteBody">The dashboard remains useful without AI; AI enriches it with current, contextual, actionable guidance.</text>
</svg>
